name: KiCad CI/CD (KiBot)

on:
  push:
    paths:
      - '**.kicad_sch'
      - '**.kicad_pcb'
      - '**.kicad_pro'
      - '**/kibot.yml'
  pull_request:
    paths:
      - '**.kicad_sch'
      - '**.kicad_pcb'
      - '**.kicad_pro'
      - '**/kibot.yml'
  workflow_dispatch:

env:
  PROJ_DIR: projects/step-motor-controller

jobs:
  # ─── CI: DRC + ERC ────────────────────────────────────────
  check:
    name: DRC + ERC (KiBot)
    runs-on: ubuntu-latest
    container: ghcr.io/inti-cmnb/kicad10_auto:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Find KiCad projects
        id: find
        working-directory: ${{ env.PROJ_DIR }}
        run: |
          pcb=$(find . -name '*.kicad_pcb' 2>/dev/null | head -1)
          sch=$(find . -name '*.kicad_sch' 2>/dev/null | head -1)
          echo "pcb=$pcb" >> $GITHUB_OUTPUT
          echo "sch=$sch" >> $GITHUB_OUTPUT
          echo "has_project=$( [ -n "$pcb" ] && echo true || echo false )" >> $GITHUB_OUTPUT

      - name: Run DRC + ERC (KiBot)
        if: steps.find.outputs.has_project == 'true'
        working-directory: ${{ env.PROJ_DIR }}
        run: |
          kibot -b "${{ steps.find.outputs.pcb }}" \
                -e "${{ steps.find.outputs.sch }}" \
                -c kibot.yml \
                -d output \
                -v \
                netlist

      - name: Upload DRC/ERC reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: drc-erc-reports
          path: ${{ env.PROJ_DIR }}/output/reports/
          if-no-files-found: ignore

  # ─── CD: Gerber + BOM + PnP + PDF + 3D ───────────────────
  manufacture:
    name: Manufacturing Files (KiBot)
    runs-on: ubuntu-latest
    container: ghcr.io/inti-cmnb/kicad10_auto:latest
    needs: check
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Find KiCad projects
        id: find
        working-directory: ${{ env.PROJ_DIR }}
        run: |
          pcb=$(find . -name '*.kicad_pcb' 2>/dev/null | head -1)
          sch=$(find . -name '*.kicad_sch' 2>/dev/null | head -1)
          echo "pcb=$pcb" >> $GITHUB_OUTPUT
          echo "sch=$sch" >> $GITHUB_OUTPUT
          echo "has_project=$( [ -n "$pcb" ] && echo true || echo false )" >> $GITHUB_OUTPUT

      - name: Generate all manufacturing files (KiBot)
        if: steps.find.outputs.has_project == 'true'
        working-directory: ${{ env.PROJ_DIR }}
        run: |
          kibot -b "${{ steps.find.outputs.pcb }}" \
                -e "${{ steps.find.outputs.sch }}" \
                -c kibot.yml \
                -d output \
                -v \
                gerbers drill bom_html bom_csv pnp pcb_pdf schematic_pdf render_3d step_3d

      - name: Zip fabrication files
        if: steps.find.outputs.has_project == 'true'
        working-directory: ${{ env.PROJ_DIR }}
        run: |
          cd output
          zip -r ../manufacturing.zip ./

      - name: Upload manufacturing files
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: manufacturing-files
          path: ${{ env.PROJ_DIR }}/output/
          if-no-files-found: ignore

      - name: Upload ZIP artifact
        if: steps.find.outputs.has_project == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: manufacturing-zip
          path: ${{ env.PROJ_DIR }}/manufacturing.zip
          if-no-files-found: ignore
