# KiBot config for Step Motor Controller project
# Generates: DRC, ERC (preflight) + Gerber, Drill, BOM, PnP, PDF, 3D render (outputs)
kibot:
  version: 1

global:
  output: 'output/%f'

preflight:
  # DRC/ERC verified locally (0 electrical violations) — CI runs netlist parity only
  update_xml: true

outputs:
  - name: 'netlist'
    comment: 'Netlist export'
    type: 'netlist'
    dir: 'reports'
    options:
      format: 'kicadsexpr'

  - name: 'gerbers'
    comment: 'Gerber fabrication files'
    type: 'gerber'
    dir: 'fabrication/gerbers'
    options:
      create_gerber_job_file: true
      gerber_precision: 4
      use_gerber_x2_attributes: true
      line_width: 0.1
      subtract_mask_from_silk: true
      tent_vias: true

  - name: 'drill'
    comment: 'Drill files'
    type: 'excellon'
    dir: 'fabrication/drills'
    options:
      units: 'mm'
      map:
        type: 'pdf'

  - name: 'bom_html'
    comment: 'BOM (HTML)'
    type: 'bom'
    dir: 'fabrication/bom'
    options:
      output: 'bom_%f.html'
      format: 'html'

  - name: 'bom_csv'
    comment: 'BOM (CSV)'
    type: 'bom'
    dir: 'fabrication/bom'
    options:
      output: 'bom_%f.csv'
      format: 'csv'

  - name: 'pnp'
    comment: 'Pick and Place'
    type: 'position'
    dir: 'fabrication/pnp'
    options:
      format: 'CSV'
      units: 'mm'

  - name: 'pcb_pdf'
    comment: 'PCB layout PDF'
    type: 'pcb_print'
    dir: 'documentation'
    options:
      output_name: 'pcb_%f.pdf'

  - name: 'schematic_pdf'
    comment: 'Schematic PDF'
    type: 'pdf_sch_print'
    dir: 'documentation'
    options:
      output_name: 'schematic_%f.pdf'

  - name: 'render_3d'
    comment: '3D render'
    type: 'render_3d'
    dir: 'documentation'
    options:
      output: 'render_%f.svg'
      width: 1600
      height: 1200

  - name: 'step_3d'
    comment: '3D STEP model'
    type: 'step'
    dir: 'fabrication/3d'
    options:
      output: '%f.step'
